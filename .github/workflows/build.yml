name: Build DSH Mobile

# 新仓库 GITHUB_TOKEN 默认只读；发布 Release 需要写权限
permissions:
  contents: write

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    needs: analyze
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
      - run: flutter pub get
      # gradle.properties 禁用了 AGP 自动下载 SDK；runner 上手动装齐固定版本
      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          yes | "$SDKMANAGER" --install \
            "ndk;28.2.13676358" \
            "build-tools;36.0.0" \
            "platforms;android-34" \
            "platforms;android-35" \
            "cmake;3.22.1" > /dev/null
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "DSH Mobile ${{ github.ref_name }}" \
            --notes "Android APK release, signed. 安装见下方。"